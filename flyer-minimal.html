<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Food Club — Flyer (minimal)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --green:#2D6A4F; --green-light:#5EB878; --green-panel:#EFF7F1; --orange:#E8913A; --ink:#141414; --muted:#5A5A5A; }
  html, body { background:#ECECEC; font-family:'Inter',system-ui,sans-serif; color:var(--ink); }

  .printbtn { position:fixed; right:20px; bottom:20px; z-index:50; font:inherit; font-weight:700; font-size:14px;
    background:var(--green-light); color:#08110b; border:0; padding:11px 22px; border-radius:999px; cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,0.25); }
  .printbtn:hover { background:#6cc787; }

  .page { width:210mm; height:297mm; margin:24px auto; background:#fff; position:relative; overflow:hidden;
    box-shadow:0 8px 40px rgba(0,0,0,0.18); display:flex; flex-direction:column; padding:14mm 16mm 13mm; }
  .page > * { position:relative; z-index:1; }

  /* Header: logo left, QR + url right, same line */
  .head { display:flex; justify-content:space-between; align-items:center; gap:12mm; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand .mark { width:62px; height:62px; display:block; }
  .brand .name { font-size:27px; font-weight:800; letter-spacing:-0.01em; color:var(--green); }
  .qrbox { text-align:center; flex-shrink:0; }
  .qrbox .qr { width:30mm; height:30mm; display:block; }
  .qrbox .url { font-size:13px; font-weight:800; color:var(--ink); margin-top:5px; letter-spacing:0.01em; }

  /* Hero — website copy, larger since there are no steps */
  .hero { margin-top:20mm; }
  .hero h1 { font-size:72px; line-height:1.02; font-weight:900; letter-spacing:-0.03em; margin-bottom:20px; max-width:14ch; }
  .hero h1 em { font-style:normal; color:var(--green); }
  .hero .lede { font-size:25px; line-height:1.45; color:var(--muted); font-weight:500; max-width:24ch; }

  /* Impact stats — website copy */
  .impact { margin-top:auto; display:flex; gap:8mm; border-top:2px solid #ECECEC; padding-top:10mm; }
  .stat { flex:1; }
  .stat .v { font-size:46px; font-weight:900; color:var(--green); line-height:1; letter-spacing:-0.02em; margin-bottom:7px; }
  .stat .l { font-size:14px; line-height:1.4; color:var(--muted); font-weight:500; }

  .foot { margin-top:9mm; display:flex; align-items:center; justify-content:space-between; font-size:14px; color:var(--muted); font-weight:600; }
  .foot .cta { color:var(--ink); }

  @media print {
    html, body { background:#fff; }
    .printbtn { display:none !important; }
    .page { width:auto; height:auto; min-height:100vh; margin:0; box-shadow:none; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  @page { size:A4; margin:0; }
</style>
</head>

        <div class="url">freefoodclub.com</div>
      </div>
    </div>

    <!-- Hero (website copy) -->
    <div class="hero">
      <h1>Grow your community through <em>free food</em></h1>
      <p class="lede">Share surplus food with neighbours nearby.<br>Free. local. simple.</p>
